data:
  name: voc2007
  data_dir: /kaggle/working/data
  manifest_dir: /kaggle/working/manifests
  num_workers: 2
  horizontal_flip: 0.5
  max_train_samples: null
  max_valid_samples: null
  max_test_samples: null
model:
  name: fasterrcnn_mobilenet_v3_large_320_fpn
  weights: imagenet1k_v1
